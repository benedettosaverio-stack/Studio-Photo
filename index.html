<title>Studio Pro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--bg4:#222;
  --border:#2a2a2a;--border2:#333;
  --text:#f0f0f0;--text2:#999;--text3:#555;
  --red:#FF0040;--red2:#cc0033;--red-dim:rgba(255,0,64,0.12);--red-glow:rgba(255,0,64,0.25);
  --gold:#D4A947;--gold-dim:rgba(212,169,71,0.12);
  --green:#22c55e;--green-dim:rgba(34,197,94,0.12);
  --blue:#3b82f6;--blue-dim:rgba(59,130,246,0.12);
  --orange:#f97316;--orange-dim:rgba(249,115,22,0.12);
  --radius:12px;--radius-sm:8px;
  --mono:"DM Mono",monospace;--sans:"Syne",sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
button{border:none;background:none;cursor:pointer;color:inherit;font-family:var(--sans)}
input,textarea,select{font-family:var(--mono);font-size:14px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:10px 12px;width:100%;outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--red)}
textarea{resize:vertical;min-height:80px}
select option{background:var(--bg3)}
label{font-family:var(--mono);font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px}
::-webkit-scrollbar{width:0;height:0}

/* Layout */
#app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto}
#header{padding:14px 20px 10px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
.header-logo{display:flex;align-items:center}
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:80px}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(10,10,10,0.96);border-top:1px solid var(--border);display:flex;z-index:100;backdrop-filter:blur(20px)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 14px;font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.05em;transition:color .2s;border:none;background:none;cursor:pointer}
.nav-btn.active{color:var(--red)}
.nav-icon{width:22px;height:22px}

/* Views */
.view{display:none}.view.active{display:block}

/* Section header */
.section-header{padding:20px 20px 14px;display:flex;align-items:center;justify-content:space-between}
.section-title{font-size:20px;font-weight:700;letter-spacing:-.02em}
.btn-icon{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--text);transition:all .2s;cursor:pointer;flex-shrink:0}
.btn-icon:active{transform:scale(.94);background:var(--red-dim);border-color:var(--red)}

/* Badges */
.badge{display:inline-block;font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:20px;letter-spacing:.04em;font-weight:500}
.badge-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,0,64,.2)}
.badge-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.badge-gold{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(212,169,71,.2)}
.badge-blue{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(59,130,246,.2)}
.badge-orange{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(249,115,22,.2)}
.badge-gray{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 10px;padding:16px;cursor:pointer;transition:border-color .2s}
.card:active{border-color:var(--border2)}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;font-family:var(--sans)}
.card-title{font-size:15px;font-weight:600}
.card-sub{font-family:var(--mono);font-size:12px;color:var(--text2);margin-top:2px}

/* Stats */
.stat-row{display:flex;gap:8px;padding:0 16px 14px}
.stat-card{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
.stat-val{font-family:var(--mono);font-size:20px;font-weight:500}
.stat-label{font-family:var(--mono);font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.stat-card.accent{border-color:var(--red);box-shadow:0 0 16px var(--red-glow)}

/* Modal */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
#modal-overlay.open{display:flex}
#modal-sheet{background:var(--bg2);border:1px solid var(--border2);border-radius:24px 24px 0 0;width:100%;max-width:430px;margin:0 auto;max-height:92dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,0,.67,0)}
#modal-overlay.open #modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0}
.modal-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.modal-title{font-size:18px;font-weight:700}
.modal-body{overflow-y:auto;padding:20px;flex:1}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.btn-primary{flex:1;background:var(--red);color:#fff;border-radius:var(--radius-sm);padding:13px;font-family:var(--sans);font-size:15px;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.btn-primary:active{transform:scale(.97);background:var(--red2)}
.btn-secondary{flex:1;background:var(--bg3);color:var(--text);border-radius:var(--radius-sm);padding:13px;font-family:var(--sans);font-size:15px;font-weight:500;border:1px solid var(--border2);cursor:pointer;transition:all .2s}
.btn-secondary:active{transform:scale(.97)}
.btn-danger{flex:1;background:rgba(255,0,64,.1);color:var(--red);border-radius:var(--radius-sm);padding:13px;font-family:var(--sans);font-size:15px;font-weight:600;border:1px solid rgba(255,0,64,.3);cursor:pointer;transition:all .2s}

/* Form */
.form-group{margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.divider{height:1px;background:var(--border);margin:4px 0 16px}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px}
.empty-label{font-family:var(--mono);font-size:13px;letter-spacing:.15em;color:var(--text3);margin-bottom:12px}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-sub{font-family:var(--mono);font-size:12px;color:var(--text3)}

/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px}
.cal-nav-title{font-size:17px;font-weight:700}
.cal-nav-btn{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 16px 16px}
.cal-day-name{text-align:center;font-family:var(--mono);font-size:10px;color:var(--text3);padding:6px 0;text-transform:uppercase}
.cal-day{text-align:center;padding:6px 2px;border-radius:8px;font-family:var(--mono);font-size:13px;cursor:pointer;min-height:36px;position:relative;transition:background .15s}
.cal-day.today{background:var(--red-dim);color:var(--red);font-weight:600}
.cal-day.has-event::after{content:"";display:block;width:4px;height:4px;background:var(--red);border-radius:50%;margin:2px auto 0}
.cal-day.other-month{color:var(--text3)}
.cal-day.selected{background:var(--red);color:#fff}

/* Sessions */
.session-item{background:var(--bg2);border-left:3px solid var(--red);border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:0 16px 8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.session-time{font-family:var(--mono);font-size:12px;color:var(--red)}
.session-name{font-size:14px;font-weight:600;margin-top:2px}
.session-type{font-family:var(--mono);font-size:11px;color:var(--text2);margin-top:2px}

/* Tarifs */
.tarif-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 8px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.tarif-name{font-size:14px;font-weight:600}
.tarif-desc{font-family:var(--mono);font-size:11px;color:var(--text2);margin-top:3px}
.tarif-price{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--red);text-align:right;white-space:nowrap}
.tarif-unit{font-family:var(--mono);font-size:10px;color:var(--text2);text-align:right}

/* Devis */
.devis-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 10px;padding:16px;cursor:pointer}
.devis-num{font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:4px}
.devis-client{font-size:15px;font-weight:600}
.devis-amount{font-family:var(--mono);font-size:17px;font-weight:500;text-align:right}
.devis-date{font-family:var(--mono);font-size:11px;color:var(--text2);text-align:right;margin-top:2px}

/* Notes & Todos */
.note-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 8px;padding:14px;cursor:pointer}
.note-title{font-size:15px;font-weight:600;margin-bottom:4px}
.note-preview{font-family:var(--mono);font-size:12px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-date{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:6px}
.todo-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
.todo-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.todo-check.done{background:var(--green);border-color:var(--green)}
.todo-text{flex:1;font-size:14px}
.todo-text.done{text-decoration:line-through;opacity:.4}

/* Home */
.home-greeting{padding:22px 20px 14px}
.home-date{font-family:var(--mono);font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.home-name{font-size:24px;font-weight:800;letter-spacing:-.03em}
.home-name span{color:var(--red)}
.section-label{font-family:var(--mono);font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.upcoming-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:7px;display:flex;gap:12px;align-items:center;cursor:pointer}
.upcoming-day{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--red);line-height:1}
.upcoming-mon{font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase}

/* Detail */
.detail-back{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;color:var(--red);margin-bottom:12px;cursor:pointer;padding:14px 20px 0}
.detail-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px 16px}
.detail-name{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.detail-section{padding:16px 20px}
.detail-section-title{font-family:var(--mono);font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-label{font-family:var(--mono);font-size:12px;color:var(--text2)}
.info-value{font-family:var(--mono);font-size:13px;text-align:right;max-width:60%}

/* Action chips */
.action-row{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap}
.action-chip{display:flex;align-items:center;gap:5px;padding:8px 13px;border-radius:20px;background:var(--bg3);border:1px solid var(--border2);font-family:var(--mono);font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s}
.action-chip:active{background:var(--red-dim);border-color:var(--red);color:var(--red)}
.chip-red{color:var(--red);border-color:rgba(255,0,64,.4)}

/* Devis lines */
.line-item-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.line-item-row input{flex:1}
.price-in{width:90px!important;flex:none!important}
.line-remove{color:var(--text3);font-size:18px;cursor:pointer;padding:4px;flex-shrink:0}
.devis-line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.devis-line:last-child{border-bottom:none}
.devis-total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--bg3);border-top:1px solid var(--border2);border-bottom:1px solid var(--border2)}
.devis-total-amount{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--red)}

/* Search */
.search-bar{margin:0 16px 12px;position:relative}
.search-bar input{padding-left:34px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;display:flex}

/* Galeries */
.galerie-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 10px;padding:14px 16px;cursor:pointer}

/* More menu */
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;cursor:pointer;transition:border-color .2s;width:100%}
.more-btn:active{border-color:var(--red)}
.more-btn-title{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--text)}
.more-btn-sub{font-family:var(--mono);font-size:11px;color:var(--text2)}

/* Tarif picker */
.tarif-picker-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.tarif-picker-item:active{background:var(--red-dim)}
.tarif-picker-item:last-child{border-bottom:none}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="header-logo">
      <div style="display:flex;flex-direction:column;gap:1px">
        <div style="font-family:var(--sans);font-size:16px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1">Saverio Benedetto</div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.12em;text-transform:uppercase">Photographe</div>
      </div>
    </div>
  </div>
  <div id="content">
    <!-- HOME -->
    <div class="view active" id="view-home">
      <div class="home-greeting">
        <div class="home-date" id="home-date"></div>
        <div class="home-name">Bonjour, <span>Saverio</span></div>
      </div>
      <div class="stat-row">
        <div class="stat-card accent"><div class="stat-val" id="stat-clients">0</div><div class="stat-label">Clients</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-sessions">0</div><div class="stat-label">Sessions</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-ca">0€</div><div class="stat-label">CA payé</div></div>
      </div>
      <div style="padding:0 16px 6px"><div class="section-label">À venir</div><div id="upcoming-list"></div></div>
      <div style="padding:0 16px 6px;margin-top:6px"><div class="section-label">Devis en attente</div><div id="pending-devis"></div></div>
      <div style="padding:0 16px 6px;margin-top:6px"><div class="section-label">Tâches</div><div id="home-todos"></div></div>
    </div>
    <!-- CLIENTS -->
    <div class="view" id="view-clients">
      <div class="section-header"><div class="section-title">Clients</div><button class="btn-icon" onclick="openModal('client')">+</button></div>
      <div class="search-bar"><span class="search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span><input type="text" placeholder="Rechercher..." id="client-search" oninput="renderClients()"></div>
      <div id="client-list"></div>
    </div>
    <div class="view" id="view-client-detail"><div id="client-detail-content"></div></div>
    <!-- AGENDA -->
    <div class="view" id="view-cal">
      <div class="section-header"><div class="section-title">Agenda</div><button class="btn-icon" onclick="openModal('session')">+</button></div>
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
        <div class="cal-nav-title" id="cal-title"></div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div id="day-sessions"></div>
    </div>
    <!-- DEVIS -->
    <div class="view" id="view-devis">
      <div class="section-header"><div class="section-title">Devis & Factures</div><button class="btn-icon" onclick="openModal('devis')">+</button></div>
      <div style="padding:0 16px 10px;display:flex;gap:8px;overflow-x:auto">
        <button class="action-chip" id="filter-all" onclick="setFilter('all')">Tous</button>
        <button class="action-chip" id="filter-devis" onclick="setFilter('devis')">Devis</button>
        <button class="action-chip" id="filter-facture" onclick="setFilter('facture')">Factures</button>
        <button class="action-chip" id="filter-paye" onclick="setFilter('paye')">Payés</button>
      </div>
      <div id="devis-list"></div>
    </div>
    <div class="view" id="view-devis-detail"><div id="devis-detail-content"></div></div>
    <!-- TARIFS -->
    <div class="view" id="view-tarifs">
      <div class="section-header"><div class="section-title">Tarifs</div><button class="btn-icon" onclick="openModal('tarif')">+</button></div>
      <div id="tarif-list"></div>
    </div>
    <!-- GALERIES -->
    <div class="view" id="view-galeries">
      <div class="section-header"><div class="section-title">Galeries</div><button class="btn-icon" onclick="openModal('galerie')">+</button></div>
      <div id="galerie-list"></div>
    </div>
    <div class="view" id="view-galerie-detail"><div id="galerie-detail-content"></div></div>
    <!-- NOTES -->
    <div class="view" id="view-notes">
      <div class="section-header"><div class="section-title">Notes & Tâches</div>
        <div style="display:flex;gap:8px">
          <button class="btn-icon" onclick="openModal('todo')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></button>
          <button class="btn-icon" onclick="openModal('note')">+</button>
        </div>
      </div>
      <div id="todos-list"></div>
      <div style="padding:4px 16px 6px;margin-top:4px"><div class="section-label">Notes</div></div>
      <div id="notes-list"></div>
    </div>
    <div class="view" id="view-note-detail"><div id="note-detail-content"></div></div>
  </div>
  <!-- NAV -->
  <nav id="nav">
    <button class="nav-btn active" onclick="navigate('home')" id="nav-home"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Accueil</span></button>
    <button class="nav-btn" onclick="navigate('clients')" id="nav-clients"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Clients</span></button>
    <button class="nav-btn" onclick="navigate('cal')" id="nav-cal"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Agenda</span></button>
    <button class="nav-btn" onclick="navigate('devis')" id="nav-devis"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Devis</span></button>
    <button class="nav-btn" onclick="showMore()" id="nav-more"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg><span>Plus</span></button>
  </nav>
</div>

<!-- MODAL -->
<div id="modal-overlay" onclick="handleOverlayClick(event)">
  <div id="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="btn-icon" onclick="closeModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- MORE OVERLAY -->
<div id="more-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:150;align-items:flex-end;backdrop-filter:blur(4px)" onclick="closeMore()">
  <div style="background:var(--bg2);border:1px solid var(--border2);border-radius:24px 24px 0 0;width:100%;max-width:430px;margin:0 auto;padding:20px 16px 40px" onclick="event.stopPropagation()">
    <div class="modal-handle" style="margin:0 auto 20px"></div>
    <div class="more-grid">
      <button class="more-btn" onclick="closeMore();navigate('tarifs')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><div class="more-btn-title">Tarifs</div><div class="more-btn-sub">Grille tarifaire</div></button>
      <button class="more-btn" onclick="closeMore();navigate('galeries')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><div class="more-btn-title">Galeries</div><div class="more-btn-sub">Par client</div></button>
      <button class="more-btn" onclick="closeMore();navigate('notes')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><div class="more-btn-title">Notes</div><div class="more-btn-sub">Notes & tâches</div></button>
      <button class="more-btn" onclick="closeMore();exportData()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg><div class="more-btn-title">Export</div><div class="more-btn-sub">Sauvegarde JSON</div></button>
    </div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────
const KEYS={clients:'sp_clients',sessions:'sp_sessions',tarifs:'sp_tarifs',devis:'sp_devis',galeries:'sp_galeries',notes:'sp_notes',todos:'sp_todos'};
function load(k){try{return JSON.parse(localStorage.getItem(KEYS[k])||'[]')}catch{return[]}}
function save(k,d){localStorage.setItem(KEYS[k],JSON.stringify(d))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().split('T')[0]}
function now(){return new Date().toISOString()}
function fmt(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}

const TARIFS_DEFAULT=[
  {id:'t1',nom:'Découverte — Événement',prix:120,unite:'forfait',cat:'reportage',desc:"1h30 · 30 photos HD · Galerie 60 jours"},
  {id:'t2',nom:'Essentielle — Événement',prix:220,unite:'forfait',cat:'reportage',desc:"3h · 60 photos HD · Galerie 90 jours"},
  {id:'t3',nom:'Complète — Événement',prix:350,unite:'forfait',cat:'reportage',desc:"5h · 100 photos HD · Galerie 6 mois"},
  {id:'t4',nom:'Journée complète — Événement',prix:550,unite:'forfait',cat:'reportage',desc:"Jusqu'à 8h · 150 photos HD · Galerie 1 an"},
  {id:'t5',nom:'Portrait Solo',prix:90,unite:'forfait',cat:'portrait',desc:"1h · 20 photos HD · Galerie 60 jours"},
  {id:'t6',nom:'Séance Couple',prix:130,unite:'forfait',cat:'portrait',desc:"1h30 · 35 photos HD · Galerie 90 jours"},
  {id:'t7',nom:'Séance Famille',prix:180,unite:'forfait',cat:'portrait',desc:"2h · 50 photos HD · Galerie 6 mois"},
  {id:'t8',nom:'Shooting Voiture Essentiel',prix:100,unite:'forfait',cat:'voiture',desc:"1h30 · 25 photos HD · Galerie 90 jours"},
  {id:'t9',nom:'Shooting Voiture Premium',prix:200,unite:'forfait',cat:'voiture',desc:"3h · 50 photos HD · 2 lieux · Galerie 6 mois"},

// ── NAVIGATION ───────────────────────────────────────────────
let currentView='home',viewStack=[];
function navigate(v){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const nb=document.getElementById('nav-'+v);if(nb)nb.classList.add('active');
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  const el=document.getElementById('view-'+v);if(el){el.classList.add('active');currentView=v;}
  viewStack=[];refreshView(v);
}
function pushView(v){
  viewStack.push(currentView);
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  currentView=v;
}
function popView(){
  const prev=viewStack.pop()||'home';
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.getElementById('view-'+prev).classList.add('active');
  currentView=prev;refreshView(prev);
}
function refreshView(v){
  if(v==='home')renderHome();
  else if(v==='clients')renderClients();
  else if(v==='cal')renderCalendar();
  else if(v==='devis')renderDevis();
  else if(v==='tarifs')renderTarifs();
  else if(v==='galeries')renderGaleries();
  else if(v==='notes')renderNotes();
}

function showTarifPicker(){
  const p=document.getElementById('tarif-picker');
  if(p.style.display==='block'){p.style.display='none';return;}
  p.innerHTML=DB.tarifs.map(t=>`<div class="tarif-picker-item" onclick="pickTarif('${t.id}')"><div><div style="font-size:13px;font-weight:600;color:var(--text)">${t.nom}</div><div style="font-family:var(--mono);font-size:11px;color:var(--text2)">${t.desc||''}</div></div><div style="font-family:var(--mono);font-size:14px;font-weight:500;color:var(--red);margin-left:12px;white-space:nowrap">${t.prix>0?t.prix+'€':'Devis'}</div></div>`).join('');
  p.style.display='block';
}
function pickTarif(tid){
  const t=DB.tarifs.find(x=>x.id===tid);if(!t)return;
  const c=document.getElementById('lines-container');
  const i=c.children.length;
  const div=document.createElement('div');
  div.className='line-item-row';div.id='line-'+i;
  div.innerHTML=`<input placeholder="Prestation" value="${t.nom}" oninput="updateLine(${i},'nom',this.value)"><input class="price-in" placeholder="Prix" type="number" value="${t.prix}" oninput="updateLine(${i},'prix',this.value)"><span class="line-remove" onclick="removeLine(${i})">✕</span>`;
  c.appendChild(div);
  document.getElementById('tarif-picker').style.display='none';
  updateDevisTotal();
}
function addLine(){
  const c=document.getElementById('lines-container');
  const i=c.children.length;
  const div=document.createElement('div');
  div.className='line-item-row';div.id='line-'+i;
  div.innerHTML=`<input placeholder="Prestation" oninput="updateLine(${i},'nom',this.value)"><input class="price-in" placeholder="Prix" type="number" oninput="updateLine(${i},'prix',this.value)"><span class="line-remove" onclick="removeLine(${i})">✕</span>`;
  c.appendChild(div);
}
function removeLine(i){const el=document.getElementById('line-'+i);if(el)el.remove();updateDevisTotal();}
function updateLine(i,k,val){updateDevisTotal();}
function updateDevisTotal(){
  const rows=document.querySelectorAll('.line-item-row');
  const total=Array.from(rows).reduce((s,r)=>{const inputs=r.querySelectorAll('input');return s+(parseFloat(inputs[1]?.value)||0);},0);
  const el=document.getElementById('devis-total-preview');
  if(el)el.textContent=total>0?`Total : ${total.toFixed(2)} €`:'';
}
function getLinesFromDOM(){
  return Array.from(document.querySelectorAll('.line-item-row')).map(r=>{
    const inputs=r.querySelectorAll('input');
    return {nom:inputs[0]?.value||'',prix:parseFloat(inputs[1]?.value)||0};
  }).filter(l=>l.nom||l.prix);
}

// ── SAVE / DELETE ────────────────────────────────────────────
function saveItem(){
  const {type,id}=mCtx;
  if(type==='client'){
    upsert('clients',{id:id||uid(),prenom:v('f-prenom'),nom:v('f-nom'),email:v('f-email'),tel:v('f-tel'),ville:v('f-ville'),type:v('f-type'),notes:v('f-notes'),createdAt:id?(DB.clients.find(x=>x.id===id)||{}).createdAt||now():now()});
  }else if(type==='session'){
    upsert('sessions',{id:id||uid(),clientId:v('f-client'),type:v('f-type'),date:v('f-date'),heure:v('f-heure'),duree:v('f-duree'),statut:v('f-statut'),lieu:v('f-lieu'),notes:v('f-notes'),createdAt:now()});
  }else if(type==='tarif'){
    upsert('tarifs',{id:id||uid(),nom:v('f-nom'),prix:parseFloat(v('f-prix'))||0,unite:v('f-unite'),desc:v('f-desc'),cat:v('f-cat')});
  }else if(type==='devis'){
    const lignes=getLinesFromDOM();
    const total=lignes.reduce((s,l)=>s+(l.prix||0),0);
    const ex=id?DB.devis.find(x=>x.id===id):{};
    const num=id?ex.num:`D-${String(DB.devis.length+1).padStart(3,'0')}`;
    upsert('devis',{id:id||uid(),num,clientId:v('f-client'),type:v('f-type'),statut:v('f-statut'),date:v('f-date'),echeance:v('f-echeance'),lignes,total,notes:v('f-notes'),createdAt:now()});
  }else if(type==='galerie'){
    upsert('galeries',{id:id||uid(),nom:v('f-nom'),clientId:v('f-client'),date:v('f-date'),nb:parseInt(v('f-nb'))||0,lien:v('f-lien'),notes:v('f-notes')});
  }else if(type==='note'){
    upsert('notes',{id:id||uid(),titre:v('f-titre'),contenu:v('f-contenu'),updatedAt:now()});
  }else if(type==='todo'){
    const ex=id?DB.todos.find(x=>x.id===id):{};
    upsert('todos',{id:id||uid(),texte:v('f-texte'),priorite:v('f-priorite'),echeance:v('f-echeance'),done:ex.done||false});
  }
  closeModal();refreshView(currentView);renderHome();
}
function deleteItem(){
  const {type,id}=mCtx;if(!id)return;
  const map={client:'clients',session:'sessions',tarif:'tarifs',devis:'devis',galerie:'galeries',note:'notes',todo:'todos'};
  const k=map[type];DB[k]=DB[k].filter(x=>x.id!==id);persist(k);
  closeModal();
  if(['client-detail','devis-detail','galerie-detail','note-detail'].includes(currentView))popView();
  else refreshView(currentView);
  renderHome();
}

// ── CALENDAR ─────────────────────────────────────────────────
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth(),selectedDay=null;
function renderCalendar(){
  const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  document.getElementById('cal-title').textContent=`${months[calMonth]} ${calYear}`;
  const grid=document.getElementById('cal-grid');
  let html=['L','M','M','J','V','S','D'].map(d=>`<div class="cal-day-name">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1),last=new Date(calYear,calMonth+1,0);
  let start=(first.getDay()+6)%7;
  const todayStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}`;
  for(let i=start-1;i>=0;i--){html+=`<div class="cal-day other-month">${new Date(calYear,calMonth,-i).getDate()}</div>`;}
  for(let d=1;d<=last.getDate();d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=DB.sessions.some(s=>s.date===ds);
    html+=`<div class="cal-day ${ds===todayStr?'today':''} ${has?'has-event':''} ${ds===selectedDay?'selected':''}" onclick="selectDay('${ds}')">${d}</div>`;
  }
  const rem=(7-((start+last.getDate())%7))%7;
  for(let i=1;i<=rem;i++)html+=`<div class="cal-day other-month">${i}</div>`;
  grid.innerHTML=html;
  renderDaySessions(selectedDay);
}
function changeMonth(dir){calMonth+=dir;if(calMonth>11){calMonth=0;calYear++;}else if(calMonth<0){calMonth=11;calYear--;}renderCalendar();}
function selectDay(ds){selectedDay=ds;renderCalendar();}
function renderDaySessions(ds){
  const el=document.getElementById('day-sessions');
  if(!ds){el.innerHTML='';return;}
  const sessions=DB.sessions.filter(s=>s.date===ds);
  const mons=['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'];
  const d=new Date(ds+'T12:00:00');
  let h=`<div style="padding:0 16px 6px;font-family:var(--mono);font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em">${d.getDate()} ${mons[d.getMonth()]} — ${sessions.length} session${sessions.length>1?'s':''}</div>`;
  if(!sessions.length){el.innerHTML=h+`<div style="padding:0 16px;font-family:var(--mono);font-size:12px;color:var(--text3)">Aucune session</div>`;return;}
  h+=sessions.map(s=>{const c=DB.clients.find(x=>x.id===s.clientId);return `<div class="session-item" onclick="openModal('session','${s.id}')"><div><div class="session-time">${s.heure||'—'} · ${s.duree||'?'}h</div><div class="session-name">${c?c.prenom+' '+c.nom:'Client'}</div><div class="session-type">${s.type||''}${s.lieu?' · '+s.lieu:''}</div></div><span class="badge badge-${s.statut==='confirmé'?'green':'gold'}">${s.statut}</span></div>`;}).join('');
  el.innerHTML=h;
}

// ── PDF ──────────────────────────────────────────────────────
function loadJsPDF(cb){
  if(window.jspdf){cb();return;}
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  s.onload=cb;s.onerror=()=>alert('Connexion requise pour exporter en PDF.');
  document.head.appendChild(s);
}
function exportPDF(id){loadJsPDF(()=>_doPDF(id));}
function _doPDF(id){
  const d=DB.devis.find(x=>x.id===id);if(!d)return;
  const c=DB.clients.find(x=>x.id===d.clientId)||{};
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,ml=15,mr=15,H=297;
  let y=15;
